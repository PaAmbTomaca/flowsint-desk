# Build + vet + test en cada push/PR, y comprobación real por distribución.
# No levanta Flowsint: la batería de aceptación (ENCARGO.md §7) y `selftest`
# se ejecutan en la máquina, con Docker rootless de verdad.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: binario estático para las distros
        run: CGO_ENABLED=0 go build -o flowsint-desk .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flowsint-desk
          path: |
            flowsint-desk
            ci/distro-check.sh
            ci/e2e.sh

  # En cada distribución: `doctor --fix` sobre el sistema pelado, instalar la
  # línea de `doctor --packages` y exigir los requisitos en verde.
  distro:
    needs: go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "debian:trixie", "fedora:latest"]
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flowsint-desk
      - name: comprobar en ${{ matrix.image }}
        run: sh ci/distro-check.sh ./flowsint-desk

  # Ciclo completo REAL (Flowsint, restic y contenedores de verdad) con cada
  # motor: el asistente `setup` entero, incluida la prueba de humo.
  e2e:
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: ["docker", "podman"]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flowsint-desk
      - name: ciclo completo con ${{ matrix.engine }}
        run: sh ci/e2e.sh ./flowsint-desk ${{ matrix.engine }}

