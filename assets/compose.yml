# Compose embebido de flowsint-desk. Se escribe en el directorio de ejecución
# (tmpfs) en cada `up`. Solo la UI publica en 127.0.0.1; el resto es intra-red.
# Los secretos llegan por --env-file (fichero 0600 en tmpfs), nunca por argv.
name: flowsint-desk

services:
  postgres:
    image: postgres:15-alpine
    container_name: flowsint-desk-postgres
    # un proceso del contenedor no puede ganar privilegios (binarios setuid, etc.)
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [desk]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  redis:
    image: redis:7-alpine
    container_name: flowsint-desk-redis
    # un proceso del contenedor no puede ganar privilegios (binarios setuid, etc.)
    security_opt: ["no-new-privileges:true"]
    # Sin persistencia: los resultados de Celery pueden llevar datos OSINT.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [desk]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  neo4j:
    image: neo4j:5
    container_name: flowsint-desk-neo4j
    # un proceso del contenedor no puede ganar privilegios (binarios setuid, etc.)
    security_opt: ["no-new-privileges:true"]
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ${DESK_RUN}/neo4j-import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks: [desk]
    healthcheck:
      # user/pass se toman del env del contenedor (NEO4J_AUTH), nunca interpolados aquí
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  api:
    image: ghcr.io/reconurge/flowsint-api:latest
    container_name: flowsint-desk-api
    # un proceso del contenedor no puede ganar privilegios (binarios setuid, etc.)
    security_opt: ["no-new-privileges:true"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_URI_BOLT=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - AUTH_SECRET=${AUTH_SECRET}
      - MASTER_VAULT_KEY_V1=${MASTER_VAULT_KEY_V1}
      - REDIS_URL=redis://redis:6379/0
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ${DESK_RUN}/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [desk]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  celery:
    image: ghcr.io/reconurge/flowsint-api:latest
    container_name: flowsint-desk-celery
    # un proceso del contenedor no puede ganar privilegios (binarios setuid, etc.)
    security_opt: ["no-new-privileges:true"]
    command: ["celery", "-A", "flowsint_core.core.celery", "worker", "--loglevel=info", "--pool=threads", "--concurrency=10"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_URI_BOLT=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MASTER_VAULT_KEY_V1=${MASTER_VAULT_KEY_V1}
      - REDIS_URL=redis://redis:6379/0
      - SKIP_MIGRATIONS=true
      - AUTH_SECRET=${AUTH_SECRET}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ${DESK_RUN}/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      api: {condition: service_started}
    # Celery no tiene servidor HTTP: el healthcheck del Dockerfile (curl) falla
    # siempre; el `inspect ping` no es fiable en rootless. Se desactiva.
    healthcheck:
      disable: true
    networks: [desk]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  app:
    image: ghcr.io/reconurge/flowsint-app:latest
    container_name: flowsint-desk-app
    # un proceso del contenedor no puede ganar privilegios (binarios setuid, etc.)
    security_opt: ["no-new-privileges:true"]
    ports:
      # Único puerto publicado, solo en loopback.
      - "127.0.0.1:${DESK_PORT}:8080"
    depends_on:
      api: {condition: service_healthy}
    networks: [desk]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

networks:
  desk:
    name: flowsint-desk-net
    driver: bridge

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
